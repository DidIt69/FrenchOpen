name: Deploy to Azure App Service

on:
  push:
    branches:
      - main          # Déclenché à chaque push sur main
  workflow_dispatch:  # Déclenchement manuel depuis GitHub Actions

env:
  AZURE_WEBAPP_NAME: "open-de-france"          # ← Remplacer par le nom de votre App Service
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "src/OpenDeFrance.Web/OpenDeFrance.Web.csproj"
  TEST_PROJECT: "tests/OpenDeFrance.Tests"

jobs:
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release --verbosity normal

      - name: Publish application
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --no-build

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: 🚀 Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
